<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
body{width:1200px;height:630px;background:linear-gradient(135deg,#0b1020 0%,#141b34 55%,#1b2450 100%);color:#fff;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(120,150,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,150,255,.06) 1px,transparent 1px);background-size:40px 40px}
.wrap{position:relative;padding:70px 80px;height:100%;display:flex;flex-direction:column;justify-content:center}
.badge{display:inline-block;align-self:flex-start;background:rgba(99,132,255,.18);border:1px solid rgba(120,150,255,.45);color:#aebdff;padding:9px 20px;border-radius:100px;font-size:20px;font-weight:600;letter-spacing:.5px;margin-bottom:30px}
h1{font-size:74px;line-height:1.06;font-weight:800;letter-spacing:-1.5px}
h1 .hl{background:linear-gradient(90deg,#6ea8ff,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin-top:28px;font-size:29px;color:#c3ccef;max-width:820px;line-height:1.4}
.chips{margin-top:44px;display:flex;gap:16px}
.chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);padding:14px 26px;border-radius:14px;font-size:23px;font-weight:600;color:#e7ecff}
.orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5}
.o1{width:320px;height:320px;background:radial-gradient(circle,#6ea8ff55,transparent 70%);top:-90px;right:-60px}
.o2{width:260px;height:260px;background:radial-gradient(circle,#a78bfa55,transparent 70%);bottom:-80px;right:180px}
</style></head><body>
<div class="grid"></div><div class="orb o1"></div><div class="orb o2"></div>
<div class="wrap">
<span class="badge">STEP-BY-STEP GUIDE · 2026</span>
<h1>How to Build an<br><span class="hl">AI Agent</span> With No Code</h1>
<p>Ship a working, tool-using agent on a drag-and-drop canvas — no programming required.</p>
<div class="chips"><div class="chip">🧠 Brain</div><div class="chip">📜 Instructions</div><div class="chip">🛠️ Tools</div><div class="chip">💾 Memory</div></div>
</div></body></html>
